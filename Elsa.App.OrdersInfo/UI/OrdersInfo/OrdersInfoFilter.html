<div id="ordersInfoFilter" class="ordersInfoFilter">
    <div class="ordersInfoFilters">
        <label class="ordersInfoFilterField ordersInfoOrderNumberFilter">
            <span class="ordersInfoFilterLabel">
                <span>Č. Obj.</span>
                <span class="ordersInfoWildcardHelp" title="Bez hvězdičky se hledá zadaný text kdekoliv v hodnotě. Text v uvozovkách se hledá bez automatického doplnění hvězdiček. Znak * můžete použít pro vlastní umístění zástupného textu.">?</span>
            </span>
            <input id="orderNumberFilter" type="text" />
        </label>

        <label class="ordersInfoFilterField ordersInfoCustomerFilter">
            <span class="ordersInfoFilterLabel">
                <span>Zákazník</span>
                <span class="ordersInfoWildcardHelp" title="Bez hvězdičky se hledá zadaný text kdekoliv v hodnotě. Text v uvozovkách se hledá bez automatického doplnění hvězdiček. Znak * můžete použít pro vlastní umístění zástupného textu.">?</span>
            </span>
            <input id="customerFilter" type="text" />
        </label>

        <label class="ordersInfoFilterField ordersInfoDiscountFilter">
            <span class="ordersInfoFilterLabel">
                <span>Sleva/kupón</span>
                <span class="ordersInfoWildcardHelp" title="Bez hvězdičky se hledá zadaný text kdekoliv v hodnotě. Text v uvozovkách se hledá bez automatického doplnění hvězdiček. Znak * můžete použít pro vlastní umístění zástupného textu.">?</span>
            </span>
            <input id="discountFilter" type="text" />
        </label>

        <label class="ordersInfoFilterField ordersInfoDateFilter">
            <span class="ordersInfoFilterLabel">Datum nákupu od</span>
            <input id="minPurchaseDateFilter" type="date" />
        </label>

        <label class="ordersInfoFilterField ordersInfoDateFilter">
            <span class="ordersInfoFilterLabel">Datum nákupu do</span>
            <input id="maxPurchaseDateFilter" type="date" />
        </label>

        <label class="ordersInfoFilterField">
            <span class="ordersInfoFilterLabel">
                <span>Cena objednávky od</span>
                <span class="ordersInfoWildcardHelp" tabindex="0" title="Jedná se o celkovou cenu objednávky s DPH včetně poštovného a uplatněných slev.">?</span>
            </span>
            <input id="minPriceWithVatFilter" type="number" step="any" />
        </label>

        <label class="ordersInfoFilterField">
            <span class="ordersInfoFilterLabel">
                <span>Cena objednávky do</span>
                <span class="ordersInfoWildcardHelp" tabindex="0" title="Jedná se o celkovou cenu objednávky s DPH včetně poštovného a uplatněných slev.">?</span>
            </span>
            <input id="maxPriceWithVatFilter" type="number" step="any" />
        </label>

        <div class="ordersInfoFilterField">
            <span class="ordersInfoFilterLabel">Stavy objednávky</span>
            <div id="erpStatusesDropdown" class="ordersInfoStatusDropdown">
                <button id="erpStatusesButton" type="button" class="ordersInfoStatusButton" event-bind="click:toggleStatuses(event)">
                    <span id="erpStatusesText">Všechny stavy</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div id="erpStatusesMenu" class="ordersInfoStatusMenu hidden"></div>
            </div>
        </div>

        <label class="ordersInfoFilterField">
            <span class="ordersInfoFilterLabel">
                <span>Způsob dopravy</span>
                <span class="ordersInfoWildcardHelp" title="Bez hvězdičky se hledá zadaný text kdekoliv v hodnotě. Text v uvozovkách se hledá bez automatického doplnění hvězdiček. Znak * můžete použít pro vlastní umístění zástupného textu.">?</span>
            </span>
            <input id="shipmentFilter" type="text" />
        </label>

        <div class="ordersInfoFilterField">
            <span class="ordersInfoFilterLabel">Způsob platby</span>
            <div id="paymentMethodsDropdown" class="ordersInfoStatusDropdown">
                <button id="paymentMethodsButton" type="button" class="ordersInfoStatusButton" event-bind="click:togglePaymentMethods(event)">
                    <span id="paymentMethodsText">Všechny způsoby platby</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div id="paymentMethodsMenu" class="ordersInfoStatusMenu hidden"></div>
            </div>
        </div>

        <div class="ordersInfoProductBatchGroup">
            <div class="ordersInfoProductBatchFields">
                <div id="placedItemAutocomplete" class="ordersInfoFilterField autocomplete">
                    <label class="ordersInfoFilterLabel" for="placedItemFilter">
                        <span>Obsahuje produkt</span>
                        <span class="ordersInfoWildcardHelp" title="Bez hvězdičky se hledá zadaný text kdekoliv v názvu. Text v uvozovkách se hledá bez automatického doplnění hvězdiček. Znak * můžete použít pro vlastní umístění zástupného textu. Můžete vybrat našeptaný produkt nebo zadat jakýkoliv text.">?</span>
                    </label>
                    <input id="placedItemFilter" type="text" />
                </div>

                <label class="ordersInfoFilterField ordersInfoBatchNumberFilter">
                    <span class="ordersInfoFilterLabel">
                        <span>Číslo šarže</span>
                        <span class="ordersInfoWildcardHelp" title="Bez hvězdičky se hledá zadaný text kdekoliv v čísle šarže. Text v uvozovkách se hledá bez automatického doplnění hvězdiček. Znak * můžete použít pro vlastní umístění zástupného textu.">?</span>
                    </span>
                    <input id="materialBatchNumberFilter" type="text" />
                </label>
            </div>
            <div class="ordersInfoProductBatchLegend">
                Pokud zadáte produkt i číslo šarže, vyhledají se objednávky, ve kterých byl zadaný produkt vypořádán z této šarže. Samotné číslo šarže hledá bez ohledu na produkt.
            </div>
        </div>
    </div>

    <div class="ordersInfoFilterActions">
        <span class="ordersInfoQuerySummary" data-bind="class.hidden:isAggregated">
            <span>Celkem objednávek: <strong data-bind="text:totalOrdersText"></strong></span>
            <span>Celková cena s DPH: <strong data-bind="text:totalPriceWithVatText"></strong></span>
            <button type="button" class="ordersInfoExportButton" data-bind="disabled:exportDisabled" title="Stáhnout výsledky dotazu jako XLSX" aria-label="Stáhnout výsledky dotazu jako XLSX" event-bind="click:exportXls()">
                <i class="far fa-file-excel" aria-hidden="true"></i>
            </button>
        </span>
        <span class="ordersInfoQuerySummary ordersInfoAggregationSummary hidden" data-bind="class!.hidden:isAggregated">
            <button type="button" class="ordersInfoExportButton" data-bind="disabled:aggregatedExportDisabled" title="Stáhnout agregovaný výsledek jako XLSX" aria-label="Stáhnout agregovaný výsledek jako XLSX" event-bind="click:exportAggregatedXls()">
                <i class="far fa-file-excel" aria-hidden="true"></i>
            </button>
            <span class="ordersInfoAggregationLegend" tabindex="0" data-bind="class!.hidden:hasAggregationLegend">
                <span class="ordersInfoAggregationLegendText" data-bind="text:aggregationLegend"></span>
            </span>
        </span>
        <span class="ordersInfoAggregationSelectWrapper restricted-OrdersInfoAggrgations">
            <select id="aggregationTypeSelect" class="ordersInfoAggregationSelect" title="Typ agregace" aria-label="Typ agregace">
                <option value="">Bez agregace</option>
            </select>
        </span>
        <button type="button" class="ordersInfoClearButton" title="Vymazat filtry" aria-label="Vymazat filtry" event-bind="click:clearFilters()">
            <i class="fas fa-eraser"></i>
        </button>
        <button type="button" class="ordersInfoLoadButton" title="Načíst objednávky" aria-label="Načíst objednávky" event-bind="click:load()">
            <i class="fas fa-search"></i>
        </button>
    </div>

    <div id="aggregationParamsContainer" class="ordersInfoAggregationParams hidden"></div>
</div>

<script>
    lt.element("ordersInfoFilter").withModel("app.OrdersInfo.vm").attach(function (
        orderNumberFilter,
        customerFilter,
        placedItemAutocomplete,
        placedItemFilter,
        materialBatchNumberFilter,
        shipmentFilter,
        paymentMethodsDropdown,
        paymentMethodsText,
        paymentMethodsMenu,
        discountFilter,
        minPurchaseDateFilter,
        maxPurchaseDateFilter,
        minPriceWithVatFilter,
        maxPriceWithVatFilter,
        erpStatusesDropdown,
        erpStatusesText,
        erpStatusesMenu,
        aggregationTypeSelect,
        aggregationParamsContainer) {

        var filterControl = this;
        var vm = app.OrdersInfo.vm;
        var currentParams = new URLSearchParams(window.location.search);
        var selectedStatusValues = currentParams.getAll("ErpStatuses");
        var selectedPaymentMethodValues = currentParams.getAll("PaymentMethodNames");
        var legacyPaymentMethodName = currentParams.get("PaymentMethodName");

        if (selectedPaymentMethodValues.length === 0 && legacyPaymentMethodName) {
            selectedPaymentMethodValues.push(legacyPaymentMethodName);
        }

        var selectedAggregationId = currentParams.get("AggregationId") || "";

        var selectedOrderStatusId = /^\d+$/.test(currentParams.get("OrderStatusId") || "")
            ? currentParams.get("OrderStatusId")
            : null;

        var setValueFromQuery = function (input, parameterName) {
            input.value = currentParams.get(parameterName) || "";
        };

        var getStatusCheckboxes = function () {
            return erpStatusesMenu.querySelectorAll("input[type='checkbox']");
        };

        var getPaymentMethodCheckboxes = function () {
            return paymentMethodsMenu.querySelectorAll("input[type='checkbox']");
        };

        var updateStatusesText = function () {
            var selected = Array.prototype.filter.call(getStatusCheckboxes(), function (checkbox) {
                return checkbox.checked;
            }).map(function (checkbox) {
                return checkbox.value;
            });

            if (selected.length === 0) {
                erpStatusesText.textContent = "Všechny stavy";
            } else if (selected.length === 1) {
                erpStatusesText.textContent = selected[0];
            } else {
                erpStatusesText.textContent = "Vybráno: " + selected.length;
            }
        };

        var addStatusOptions = function (statuses) {
            (statuses || []).forEach(function (status) {
                var label = document.createElement("label");
                var checkbox = document.createElement("input");
                var text = document.createElement("span");

                label.className = "ordersInfoStatusOption";
                checkbox.type = "checkbox";
                checkbox.value = status;
                checkbox.checked = selectedStatusValues.indexOf(status) !== -1;
                checkbox.addEventListener("change", updateStatusesText);
                text.textContent = status;

                label.appendChild(checkbox);
                label.appendChild(text);
                erpStatusesMenu.appendChild(label);
            });

            updateStatusesText();
        };

        var addPaymentOptions = function (paymentMethods) {
            (paymentMethods || []).forEach(function (paymentMethod) {
                var label = document.createElement("label");
                var checkbox = document.createElement("input");
                var text = document.createElement("span");
                var paymentMethodName = paymentMethod.Name;

                label.className = "ordersInfoStatusOption";
                if (!paymentMethod.IsActive) {
                    label.classList.add("ordersInfoPaymentOptionHistorical");
                }

                if (paymentMethod.LastUsedDtText) {
                    label.title = "Naposledy použito: " + paymentMethod.LastUsedDtText;
                }

                checkbox.type = "checkbox";
                checkbox.value = paymentMethodName;
                checkbox.checked = selectedPaymentMethodValues.indexOf(paymentMethodName) !== -1;
                checkbox.addEventListener("change", updatePaymentMethodsText);
                text.textContent = paymentMethodName;

                label.appendChild(checkbox);
                label.appendChild(text);
                paymentMethodsMenu.appendChild(label);
            });

            updatePaymentMethodsText();
        };

        var updatePaymentMethodsText = function () {
            var selected = Array.prototype.filter.call(getPaymentMethodCheckboxes(), function (checkbox) {
                return checkbox.checked;
            }).map(function (checkbox) {
                return checkbox.value;
            });

            if (selected.length === 0) {
                paymentMethodsText.textContent = "Všechny způsoby platby";
            } else if (selected.length === 1) {
                paymentMethodsText.textContent = selected[0];
            } else {
                paymentMethodsText.textContent = "Vybráno: " + selected.length;
            }
        };

        var addAggregationTypeOptions = function (aggregationTypes) {
            (aggregationTypes || []).forEach(function (aggregationType) {
                var option = document.createElement("option");
                option.value = aggregationType.Id;
                option.textContent = aggregationType.Name;
                aggregationTypeSelect.appendChild(option);
            });

            aggregationTypeSelect.value = selectedAggregationId;

            if (aggregationTypeSelect.value !== selectedAggregationId) {
                aggregationTypeSelect.value = "";
            }

            updateAggregationTypeTitle();
        };

        var updateAggregationTypeTitle = function () {
            var selectedOption = aggregationTypeSelect.options[aggregationTypeSelect.selectedIndex];
            aggregationTypeSelect.title = selectedOption && selectedOption.value
                ? "Typ agregace: " + selectedOption.textContent
                : "Typ agregace";
        };

        var renderAggregationParameters = function (parameters) {
            aggregationParamsContainer.innerHTML = "";
            aggregationParamsContainer.classList.toggle("hidden", !parameters || parameters.length === 0);

            (parameters || []).forEach(function (parameter) {
                var label = document.createElement("label");
                var title = document.createElement("span");
                var select = document.createElement("select");

                label.className = "ordersInfoFilterField ordersInfoAggregationParam";
                title.className = "ordersInfoFilterLabel";
                title.textContent = parameter.Title;

                select.setAttribute("data-option-id", parameter.OptionId);

                if (parameter.Values.length === 0) {
                    var emptyOption = document.createElement("option");
                    emptyOption.value = "";
                    emptyOption.textContent = "";
                    select.appendChild(emptyOption);
                    select.disabled = true;
                }

                parameter.Values.forEach(function (value) {
                    var option = document.createElement("option");
                    option.value = value;
                    option.textContent = value;
                    select.appendChild(option);
                });

                select.value = parameter.SelectedValue;
                select.title = parameter.Title + ": " + select.value;
                select.addEventListener("change", function () {
                    filterControl.load();
                });

                label.appendChild(title);
                label.appendChild(select);
                aggregationParamsContainer.appendChild(label);
            });
        };

        var appendValue = function (params, name, value) {
            var normalizedValue = (value || "").trim();
            if (normalizedValue) {
                params.append(name, normalizedValue);
            }
        };

        setValueFromQuery(orderNumberFilter, "OrderNumber");
        setValueFromQuery(customerFilter, "CustomerNameWildcard");
        setValueFromQuery(placedItemFilter, "ContainsPlacedItemWildcard");
        setValueFromQuery(materialBatchNumberFilter, "MaterialBatchNumberWildcard");
        setValueFromQuery(shipmentFilter, "ShipmentMethodNameWildcard");
        setValueFromQuery(discountFilter, "DiscountTextWildcard");
        setValueFromQuery(minPurchaseDateFilter, "MinPurchaseDt");
        setValueFromQuery(maxPurchaseDateFilter, "MaxPurchaseDt");
        setValueFromQuery(minPriceWithVatFilter, "MinPriceWithVat");
        setValueFromQuery(maxPriceWithVatFilter, "MaxPriceWithVat");

        app.ui.autosuggest(placedItemAutocomplete, vm.getPlacedItemNames);
        vm.getErpStatuses(addStatusOptions);
        vm.getPaymentMethods(addPaymentOptions);
        vm.getAggregationTypes(addAggregationTypeOptions);
        vm.setAggregationParametersRenderer(renderAggregationParameters);

        this.toggleStatuses = function (event) {
            event.stopPropagation();
            erpStatusesMenu.classList.toggle("hidden");
            paymentMethodsMenu.classList.add("hidden");
        };

        this.togglePaymentMethods = function (event) {
            event.stopPropagation();
            paymentMethodsMenu.classList.toggle("hidden");
            erpStatusesMenu.classList.add("hidden");
        };

        this.clearFilters = function () {
            orderNumberFilter.value = "";
            customerFilter.value = "";
            placedItemFilter.value = "";
            materialBatchNumberFilter.value = "";
            shipmentFilter.value = "";
            discountFilter.value = "";
            minPurchaseDateFilter.value = "";
            maxPurchaseDateFilter.value = "";
            minPriceWithVatFilter.value = "";
            maxPriceWithVatFilter.value = "";
            selectedOrderStatusId = null;

            Array.prototype.forEach.call(getStatusCheckboxes(), function (checkbox) {
                checkbox.checked = false;
            });

            Array.prototype.forEach.call(getPaymentMethodCheckboxes(), function (checkbox) {
                checkbox.checked = false;
            });

            erpStatusesMenu.classList.add("hidden");
            paymentMethodsMenu.classList.add("hidden");
            updateStatusesText();
            updatePaymentMethodsText();
        };

        this.exportXls = function () {
            vm.exportXls();
        };

        this.exportAggregatedXls = function () {
            vm.exportAggregatedXls();
        };

        this.load = function () {
            if (!minPriceWithVatFilter.reportValidity() || !maxPriceWithVatFilter.reportValidity()) {
                return;
            }

            var params = new URLSearchParams();

            appendValue(params, "OrderNumber", orderNumberFilter.value);
            appendValue(params, "CustomerNameWildcard", customerFilter.value);
            appendValue(params, "ContainsPlacedItemWildcard", placedItemFilter.value);
            appendValue(params, "MaterialBatchNumberWildcard", materialBatchNumberFilter.value);
            appendValue(params, "ShipmentMethodNameWildcard", shipmentFilter.value);
            appendValue(params, "DiscountTextWildcard", discountFilter.value);
            appendValue(params, "MinPurchaseDt", minPurchaseDateFilter.value);
            appendValue(params, "MaxPurchaseDt", maxPurchaseDateFilter.value);
            appendValue(params, "MinPriceWithVat", minPriceWithVatFilter.value);
            appendValue(params, "MaxPriceWithVat", maxPriceWithVatFilter.value);
            appendValue(params, "OrderStatusId", selectedOrderStatusId);
            appendValue(params, "AggregationId", aggregationTypeSelect.value);

            if (aggregationTypeSelect.value && aggregationTypeSelect.value === selectedAggregationId) {
                Array.prototype.forEach.call(aggregationParamsContainer.querySelectorAll("select[data-option-id]"), function (select) {
                    params.append(app.OrdersInfo.AGGREGATION_PARAM_PREFIX + select.getAttribute("data-option-id"), select.value);
                });
            }

            Array.prototype.forEach.call(getStatusCheckboxes(), function (checkbox) {
                if (checkbox.checked) {
                    params.append("ErpStatuses", checkbox.value);
                }
            });

            Array.prototype.forEach.call(getPaymentMethodCheckboxes(), function (checkbox) {
                if (checkbox.checked) {
                    params.append("PaymentMethodNames", checkbox.value);
                }
            });

            var queryString = params.toString();
            var targetUrl = window.location.pathname + (queryString ? "?" + queryString : "") + window.location.hash;
            window.location.assign(targetUrl);
        };

        Array.prototype.forEach.call(
            filterControl.querySelectorAll("input[type='text'], input[type='date'], input[type='number']"),
            function (input) {
                input.addEventListener("keydown", function (event) {
                    if (event.key !== "Enter") {
                        return;
                    }

                    event.preventDefault();
                    filterControl.load();
                });
            });

        aggregationTypeSelect.addEventListener("change", function () {
            updateAggregationTypeTitle();
            filterControl.load();
        });

        document.addEventListener("click", function (event) {
            if (!erpStatusesDropdown.contains(event.target)) {
                erpStatusesMenu.classList.add("hidden");
            }

            if (!paymentMethodsDropdown.contains(event.target)) {
                paymentMethodsMenu.classList.add("hidden");
            }
        });
    });
</script>
