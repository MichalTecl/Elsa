
<div class="panel w1" id="repWidget">
    <div class="panelHead">
        <div class="panelTitle">Reporty</div>
        <a class="bulletinLink restricted-ViewBulletin" href="/reporting/getLatestBulletin"
           target="_blank" rel="noopener" title="Otevřít nejnovější Bulletin"
           aria-label="Otevřít nejnovější Bulletin v nové záložce">
            <i class="fas fa-eye" aria-hidden="true"></i>
        </a>
    </div>

    <div class="panelContent" id="reportingPanel" style="">
        <div class="actionTile restricted-ReportingApp">
            <i class="fas fa-table actionTileIcon"></i>
            <a href="/UI/Reporting/ReportListPage.html">Reporty</a>
        </div>
        
    <div class="actionTile stackLeft restricted-InspectorApp" id="inspectorRow">
        <i class="far fa-meh-blank  actionTileIcon" data-bind="class!.hidden:isLoading"></i>
        <i class="far fa-frown inspbouncer animate__animated  actionTileIcon" id="inspbouncer" data-bind="class!.hidden:isMad"></i>
        <i class="far fa-smile  actionTileIcon" data-bind="class!.hidden:isHappy"></i>
        <a href="/UI/Inspector/Inspector.html">Inspektor</a>
        <div class="inspbouncer inspIssuesCount" data-bind="text:totalIssues;class!.hidden:isMad"></div>
        
    </div>

    </div>
    <script src="/UI/Inspector/Inspector.vm.js"></script>
    <script>
        lt.element("inspectorRow").withModel("app.Inspector.vm").attach(function () {
            setTimeout(function() {
                    app.Inspector.vm.init(true);
                },
                1000);
        });
    </script>
</div>
<link href="/UI/Inspector/Inspector.css" rel="stylesheet" />
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
/>
<style>
    #repWidget .bulletinLink {
        margin-left: auto;
        align-self: center;
        padding: 2px 6px;
        color: #f0f0f0;
        text-decoration: none;
        border-radius: 3px;
    }

    #repWidget .bulletinLink:hover {
        background: rgba(255, 255, 255, 0.15);
    }

    #repWidget .bulletinLink:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 2px;
    }
    .inspbouncer {
        display: inline-block;
        animation-duration: 2s; /* don't forget to set a duration! */
    }
</style>
<script>
    var shakes = ['animate__bounce', 'animate__flash', 'animate__pulse', 'animate__swing', 'animate__rubberBand', 'animate__headShake'];

    var doShake = function () {

        var bouncers = document.getElementsByClassName("inspbouncer");

        for (var bouncer of bouncers) {

            for (var toRem of shakes) {
                bouncer.classList.remove(toRem);
            }

            var ef = shakes[Math.floor(Math.random() * shakes.length)];
            bouncer.classList.add(ef);
        }

        setTimeout(doShake, Math.random() * 3000 + 3000);
    }

    doShake();

</script>
