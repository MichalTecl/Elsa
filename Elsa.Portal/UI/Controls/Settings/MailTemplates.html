<div id="mailTemplatesSettings" class="mailTemplatesSettings">
    <style>
        .mailTemplatesSettings .mailTemplatesToolbar { margin-bottom: 12px; }
        .mailTemplatesSettings .mailTemplatesTable { width: 100%; border-collapse: collapse; }
        .mailTemplatesSettings .mailTemplatesTable th,
        .mailTemplatesSettings .mailTemplatesTable td { padding: 8px 10px; border-bottom: 1px solid #ddd; text-align: left; }
        .mailTemplatesSettings .mailTemplatesRow { cursor: pointer; }
        .mailTemplatesSettings .mailTemplatesRow:hover { background: #f5f5f5; }
        .mailTemplatesSettings .mailTemplatesEditor { margin-top: 16px; }
        .mailTemplatesSettings .mailTemplatesField { display: block; margin-bottom: 12px; }
        .mailTemplatesSettings .mailTemplatesField span { display: block; margin-bottom: 4px; font-weight: bold; }
        .mailTemplatesSettings .mailTemplatesField input,
        .mailTemplatesSettings .mailTemplatesField textarea,
        .mailTemplatesSettings .mailTemplatesField select { box-sizing: border-box; width: 100%; }
        .mailTemplatesSettings .mailTemplatesBody { min-height: 300px; font-family: monospace; }
        .mailTemplatesSettings .mailTemplatesPreview { width: 100%; min-height: 360px; box-sizing: border-box; border: 1px solid #ccc; background: white; }
        .mailTemplatesSettings .mailTemplatesHint { margin: -4px 0 12px; font-size: 11px; opacity: 0.65; }
        .mailTemplatesSettings .mailTemplatesTest { display: grid; grid-template-columns: minmax(160px, 220px) minmax(240px, 1fr) auto; gap: 8px; align-items: end; margin: 16px 0; padding-top: 16px; border-top: 1px solid #ddd; }
        .mailTemplatesSettings .mailTemplatesTest .mailTemplatesField { margin-bottom: 0; }
        .mailTemplatesSettings .mailTemplatesTest select { box-sizing: border-box; width: 100%; height: 27px; }
        .mailTemplatesSettings .mailTemplatesTestValues { grid-column: 1 / -1; }
        .mailTemplatesSettings .mailTemplatesTestValues textarea { min-height: 100px; font-family: monospace; }
        .mailTemplatesSettings .mailTemplatesActions { display: flex; justify-content: space-between; }
        .mailTemplatesSettings .mailTemplatesSaveActions { display: flex; gap: 8px; }
        .mailTemplatesSettings .mailTemplatesDelete { color: #a00; }
    </style>

    <div class="mailTemplatesToolbar">
        <button type="button" event-bind="click:createTemplate()">
            <i class="fas fa-plus"></i>
            Přidat šablonu
        </button>
    </div>

    <table class="mailTemplatesTable">
        <thead>
            <tr>
                <th>Název šablony</th>
                <th>Předmět</th>
                <th>Formát</th>
            </tr>
        </thead>
        <tbody data-bind="itemsSource:templates" data-key="TypeName">
            <tr class="lt-template mailTemplatesRow" event-bind="click:openTemplate(TypeName)">
                <td data-bind="text:TypeName"></td>
                <td data-bind="text:Subject"></td>
                <td data-bind="text:BodyFormatText"></td>
            </tr>
        </tbody>
    </table>

    <div class="panel mailTemplatesEditor hidden" data-bind="class!.hidden:hasEditor">
        <div class="panelHead">
            <div class="panelTitle" data-bind="text:editorTitle"></div>
        </div>
        <div class="panelContent">
            <label class="mailTemplatesField">
                <span>Název šablony (bez přípony)</span>
                <input type="text" data-bind="value:editor.TypeName" event-bind="input:updateTypeName(this.value)" />
            </label>

            <label class="mailTemplatesField">
                <span>Předmět</span>
                <input type="text" data-bind="value:editor.Subject" event-bind="input:updateSubject(this.value)" />
            </label>

            <label class="mailTemplatesField">
                <span>Formát těla</span>
                <select data-bind="value:editor.BodyFormat" event-bind="change:updateBodyFormat(this.value)">
                    <option value="PlainText">Prostý text</option>
                    <option value="Html">HTML</option>
                </select>
            </label>

            <label class="mailTemplatesField">
                <span data-bind="text:bodyEditorLabel"></span>
                <textarea class="mailTemplatesBody" data-bind="value:editor.Body" event-bind="input:updateBody(this.value)"></textarea>
            </label>

            <label class="mailTemplatesField hidden" data-bind="class!.hidden:isHtml">
                <span>Náhled HTML</span>
                <iframe class="mailTemplatesPreview" sandbox="allow-same-origin" referrerpolicy="no-referrer" lt-name="htmlPreview" title="Náhled HTML e-mailu"></iframe>
            </label>

            <div class="mailTemplatesHint">
                V předmětu i těle zapisujte placeholdery ve formátu <code>{%valueName%}</code>.
                HTML obrázky zapisujte například jako <code>&lt;img src="obrazek1.jpg"&gt;</code>;
                načítají se výhradně z <code>C:\Elsa\EmailTemplates</code>.
            </div>

            <div class="mailTemplatesTest">
                <label class="mailTemplatesField">
                    <span>Odesílatel</span>
                    <select data-bind="value:testMailboxType" event-bind="change:updateTestMailboxType(this.value)">
                        <option value="SystemRobot">Systémový</option>
                        <option value="CustomerFacingSender">Zákaznický</option>
                    </select>
                </label>
                <label class="mailTemplatesField">
                    <span>Testovací e-mail</span>
                    <input type="email" data-bind="value:testRecipient" event-bind="input:updateTestRecipient(this.value)" />
                </label>
                <button type="button" event-bind="click:sendTestMail()">Odeslat test</button>
                <label class="mailTemplatesField mailTemplatesTestValues">
                    <span>Hodnoty placeholderů pro test (JSON)</span>
                    <textarea data-bind="value:testValuesText" event-bind="input:updateTestValues(this.value)" placeholder='{"valueName":"Testovací hodnota"}'></textarea>
                </label>
            </div>

            <div class="mailTemplatesActions">
                <button type="button" class="mailTemplatesDelete hidden" data-bind="class!.hidden:editor.CanDelete" event-bind="click:deleteTemplate()">Smazat</button>
                <div class="mailTemplatesSaveActions">
                    <button type="button" event-bind="click:closeEditor()">Zrušit</button>
                    <button type="button" event-bind="click:saveTemplate()">Uložit</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    app.MailTemplatesSettings = app.MailTemplatesSettings || {};
    app.MailTemplatesSettings.VM = app.MailTemplatesSettings.VM || function () {
        const self = this;

        self.templates = [];
        self.editor = null;
        self.hasEditor = false;
        self.editorTitle = "";
        self.bodyEditorLabel = "Tělo e-mailu";
        self.isHtml = false;
        self.testMailboxType = "SystemRobot";
        self.testRecipient = "";
        self.testValuesText = "{}";

        const testValuesStorageKey = template => {
            const typeName = template && (template.OriginalTypeName || template.TypeName);
            return "elsa.mailTemplates.testValues." + (typeName || "new");
        };

        const loadTestValues = template => {
            try {
                self.testValuesText = localStorage.getItem(testValuesStorageKey(template)) || "{}";
            } catch (error) {
                self.testValuesText = "{}";
            }
        };

        const parseApiResponse = response => {
            let parsedResponse = response;
            for (let attempt = 0; attempt < 2 && typeof parsedResponse === "string"; attempt++) {
                try {
                    parsedResponse = JSON.parse(parsedResponse.replace(/^\uFEFF/, ""));
                } catch (error) {
                    return null;
                }
            }

            return parsedResponse;
        };

        const decodeUtf8Base64 = value => {
            const binary = atob(value || "");
            const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
            return new TextDecoder("utf-8").decode(bytes);
        };

        const mapTemplates = (templates) => {
            const templateList = parseApiResponse(templates);

            if (!Array.isArray(templateList)) {
                console.error("Seznam e-mailových šablon nemá očekávaný formát.", templates);
                return;
            }

            self.templates = templateList.map(template => ({
                TypeName: template.TypeName || "",
                Subject: template.Subject || "",
                BodyFormat: template.BodyFormat || "PlainText",
                BodyFormatText: template.BodyFormat === "Html" ? "HTML" : "Prostý text"
            }));
        };

        const refresh = () => {
            lt.api("/mailTemplates/getAll").get(templates => {
                mapTemplates(templates);
                lt.notify();
            });
        };

        let previewFrame = null;

        const htmlEncode = value => String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#39;");

        const renderPreviewBody = () => {
            const body = self.editor ? (self.editor.Body || "") : "";
            let values;
            try {
                values = JSON.parse(self.testValuesText || "{}");
            } catch (error) {
                return body;
            }

            if (!values || Array.isArray(values) || typeof values !== "object") {
                return body;
            }

            const normalizedValues = {};
            Object.keys(values).forEach(key => {
                normalizedValues[key.toLocaleLowerCase()] = values[key] == null ? "" : String(values[key]);
            });

            return body.replace(/\{%([^{}%]+)%\}/g, (placeholder, name) => {
                const normalizedName = name.toLocaleLowerCase();
                return Object.prototype.hasOwnProperty.call(normalizedValues, normalizedName)
                    ? htmlEncode(normalizedValues[normalizedName])
                    : placeholder;
            });
        };

        const rewritePreviewPictures = html => {
            const documentModel = new DOMParser().parseFromString(html, "text/html");
            documentModel.querySelectorAll("script, base, object, embed, meta[http-equiv='refresh']")
                .forEach(element => element.remove());
            documentModel.querySelectorAll("img[src]").forEach(image => {
                const source = image.getAttribute("src");
                image.removeAttribute("srcset");
                image.setAttribute("src", "/mailTemplates/getPicture?path=" + encodeURIComponent(source));
            });

            return "<!doctype html>" + documentModel.documentElement.outerHTML;
        };

        const updatePreview = () => {
            self.isHtml = !!self.editor && self.editor.BodyFormat === "Html";
            self.bodyEditorLabel = self.isHtml ? "HTML zdroj" : "Tělo e-mailu";

            if (previewFrame) {
                previewFrame.srcdoc = self.isHtml ? rewritePreviewPictures(renderPreviewBody()) : "";
            }
        };

        const showEditor = (template) => {
            const body = template.BodyBase64 == null
                ? (template.Body || "")
                : decodeUtf8Base64(template.BodyBase64);
            self.editor = {
                TypeName: template.TypeName || "",
                OriginalTypeName: template.OriginalTypeName || null,
                Subject: template.Subject || "",
                Body: body,
                BodyFormat: template.BodyFormat || "PlainText",
                OriginalBodyFormat: template.OriginalBodyFormat || null,
                CanDelete: !!template.OriginalTypeName
            };
            loadTestValues(self.editor);
            updatePreview();
            self.editorTitle = self.editor.OriginalTypeName ? "Upravit e-mailovou šablonu" : "Nová e-mailová šablona";
            self.hasEditor = true;
            lt.notify();
        };

        self.createTemplate = () => showEditor({});

        self.openTemplate = (typeName) => {
            lt.api("/mailTemplates/get").query({ typeName: typeName }).get(response => {
                const template = parseApiResponse(response);
                if (!template || Array.isArray(template) || !template.OriginalTypeName) {
                    console.error("Detail e-mailové šablony nemá očekávaný formát.", response);
                    alert("Detail e-mailové šablony se nepodařilo načíst.");
                    return;
                }

                showEditor(template);
            });
        };

        self.closeEditor = () => {
            self.editor = null;
            self.hasEditor = false;
            updatePreview();
            lt.notify();
        };

        self.saveTemplate = () => {
            if (!self.editor) {
                return;
            }

            const typeName = (self.editor.TypeName || "").trim();
            if (!typeName) {
                alert("Název šablony musí být vyplněný.");
                return;
            }

            const duplicateExists = self.templates.some(template =>
                (template.TypeName || "").toLocaleLowerCase()
                    !== (self.editor.OriginalTypeName || "").toLocaleLowerCase()
                && (template.TypeName || "").trim().toLocaleLowerCase() === typeName.toLocaleLowerCase());

            if (duplicateExists) {
                alert("Šablona se stejným názvem již existuje.");
                return;
            }

            const oldStorageKey = testValuesStorageKey(self.editor);
            lt.api("/mailTemplates/save").body({
                TypeName: typeName,
                OriginalTypeName: self.editor.OriginalTypeName,
                Subject: self.editor.Subject || "",
                Body: self.editor.Body || "",
                BodyFormat: self.editor.BodyFormat || "PlainText",
                OriginalBodyFormat: self.editor.OriginalBodyFormat
            }).post(response => {
                const savedTemplate = parseApiResponse(response);
                const newStorageKey = testValuesStorageKey({ OriginalTypeName: typeName });
                if (savedTemplate && oldStorageKey !== newStorageKey) {
                    try {
                        localStorage.setItem(newStorageKey, self.testValuesText);
                        localStorage.removeItem(oldStorageKey);
                    } catch (error) {
                        // Prohlížeč může mít lokální úložiště zakázané.
                    }
                }

                self.closeEditor();
                refresh();
            });
        };

        self.deleteTemplate = () => {
            if (!self.editor || !self.editor.OriginalTypeName || !confirm("Opravdu chcete e-mailovou šablonu smazat?")) {
                return;
            }

            lt.api("/mailTemplates/delete").query({
                typeName: self.editor.OriginalTypeName,
                bodyFormat: self.editor.OriginalBodyFormat
            }).post(templates => {
                self.closeEditor();
                mapTemplates(templates);
                lt.notify();
            });
        };

        self.sendTestMail = () => {
            if (!self.editor) {
                return;
            }

            const recipient = (self.testRecipient || "").trim();
            if (!recipient) {
                alert("E-mail příjemce musí být vyplněný.");
                return;
            }

            let parsedValues;
            try {
                parsedValues = JSON.parse(self.testValuesText || "{}");
            } catch (error) {
                alert("Hodnoty placeholderů nejsou platný JSON.");
                return;
            }

            if (!parsedValues || Array.isArray(parsedValues) || typeof parsedValues !== "object") {
                alert("Hodnoty placeholderů musí být JSON objekt.");
                return;
            }

            const values = {};
            Object.keys(parsedValues).forEach(key => {
                values[key] = parsedValues[key] == null ? "" : String(parsedValues[key]);
            });

            lt.api("/mailTemplates/sendTestMail").body({
                MailboxType: self.testMailboxType,
                Recipient: recipient,
                Subject: self.editor.Subject || "",
                Body: self.editor.Body || "",
                BodyFormat: self.editor.BodyFormat || "PlainText",
                Values: values
            }).post(() => alert("Testovací e-mail byl odeslán."));
        };

        self.updateTypeName = value => self.editor.TypeName = value;
        self.updateSubject = value => self.editor.Subject = value;
        self.updateBody = value => {
            self.editor.Body = value;
            updatePreview();
            lt.notify();
        };
        self.updateBodyFormat = value => {
            self.editor.BodyFormat = value;
            updatePreview();
            lt.notify();
        };
        self.updateTestMailboxType = value => self.testMailboxType = value;
        self.updateTestRecipient = value => self.testRecipient = value;
        self.updateTestValues = value => {
            self.testValuesText = value;
            updatePreview();
            try {
                localStorage.setItem(testValuesStorageKey(self.editor), value);
            } catch (error) {
                // Prohlížeč může mít lokální úložiště zakázané; test lze použít i bez něj.
            }
        };
        self.setPreviewFrame = frame => {
            previewFrame = frame;
            updatePreview();
        };

        lt.api("/mailTemplates/getTestMailSettings").get(settings => {
            self.testRecipient = settings.Recipient || "";
            lt.notify();
        });
        refresh();
    };

    app.MailTemplatesSettings.vm = app.MailTemplatesSettings.vm || new app.MailTemplatesSettings.VM();

    lt.element("mailTemplatesSettings")
        .withModel("app.MailTemplatesSettings.vm")
        .attach(function (htmlPreview) {
            const vm = app.MailTemplatesSettings.vm;
            vm.setPreviewFrame(htmlPreview);

            this.createTemplate = () => vm.createTemplate();
            this.openTemplate = id => vm.openTemplate(id);
            this.closeEditor = () => vm.closeEditor();
            this.saveTemplate = () => vm.saveTemplate();
            this.deleteTemplate = () => vm.deleteTemplate();
            this.sendTestMail = () => vm.sendTestMail();
            this.updateTypeName = value => vm.updateTypeName(value);
            this.updateSubject = value => vm.updateSubject(value);
            this.updateBody = value => vm.updateBody(value);
            this.updateBodyFormat = value => vm.updateBodyFormat(value);
            this.updateTestMailboxType = value => vm.updateTestMailboxType(value);
            this.updateTestRecipient = value => vm.updateTestRecipient(value);
            this.updateTestValues = value => vm.updateTestValues(value);
        });
</script>
