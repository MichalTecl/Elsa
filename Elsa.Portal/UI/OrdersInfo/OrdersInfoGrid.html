<div id="ordersInfoGrid" class="ordersInfoGrid">
    <div class="ordersInfoDrilldownInfo hidden" data-bind="class!.hidden:isDrilldown">
        <i class="fas fa-filter" aria-hidden="true"></i>
        <span>Zobrazeny jen objednávky z buňky agregace: <strong data-bind="text:drilldownTitle"></strong></span>
        <a data-bind="href:drilldownBackUrl">Zpět na agregaci</a>
        <a data-bind="href:drilldownCancelUrl">Zobrazit všechny objednávky</a>
    </div>

    <div class="ordersInfoLoading hidden" data-bind="class!.hidden:isLoading">Načítám objednávky…</div>
    <div class="ordersInfoEmpty hidden" data-bind="class!.hidden:isEmpty">Žádné objednávky neodpovídají zadaným filtrům.</div>

    <div class="ordersInfoGridContent hidden" data-bind="class!.hidden:hasOrders">
        <div class="ordersInfoGridHeader">
            <span></span>
            <span>Číslo objednávky</span>
            <span>Datum nákupu</span>
            <span>Zákazník</span>
            <span>Stav</span>
            <span>Způsob dopravy</span>
            <span>Platební metoda</span>
            <span>Slevy</span>
            <span class="ordersInfoPrice">Cena s DPH</span>
        </div>

        <div class="ordersInfoGridBody" data-bind="itemsSource:orders" data-key="OrderId">
            <div class="lt-template ordersInfoGridItem">
                <div class="ordersInfoGridSummary" event-bind="click:toggleOrderDetail(VM)">
                    <span class="ordersInfoExpander">
                        <i class="fas fa-chevron-right" data-bind="class.hidden:IsExpanded"></i>
                        <i class="fas fa-chevron-down hidden" data-bind="class!.hidden:IsExpanded"></i>
                    </span>
                    <span data-bind="text:OrderNumber"></span>
                    <span data-bind="text:PurchaseDateText; title:PurchaseDateTitle"></span>
                    <span>
                        <span data-bind="class.hidden:CanOpenCustomerInCrm; text:CustomerName"></span>
                        <a href="#" class="hidden" data-bind="class!.hidden:CanOpenCustomerInCrm; text:CustomerName" event-bind="click:openCustomerInCrm(VM, event)"></a>
                    </span>
                    <span data-bind="text:ErpStatusName"></span>
                    <span class="ordersInfoShipping" data-bind="text:ShippingMethodName; title:ShippingMethodName"></span>
                    <span data-bind="text:PaymentMethodName; title:PaymentMethodName"></span>
                    <span data-bind="text:Discounts; title:Discounts"></span>
                    <span class="ordersInfoPrice" data-bind="text:PriceWithVatText"></span>
                </div>

                <div class="ordersInfoGridDetail hidden" data-bind="class!.hidden:IsExpanded">
                    <div data-bind="fill-by:detailControl"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="ordersInfoEmpty hidden" data-bind="class!.hidden:isAggregatedEmpty">Agregace pro zadané filtry nevrátila žádná data.</div>
    <div class="ordersInfoEmpty ordersInfoAggregationMessage hidden" data-bind="text:aggregationMessage; class!.hidden:hasAggregationMessage"></div>

    <div class="ordersInfoAggregation hidden" data-bind="class!.hidden:hasAggregatedResult">
        <table class="ordersInfoAggregationTable">
            <thead>
                <tr data-bind="itemsSource:aggregatedColumns" data-key="Key">
                    <th class="lt-template" data-bind="text:Title"></th>
                </tr>
            </thead>
            <tbody data-bind="itemsSource:aggregatedRows" data-key="Key">
                <tr class="lt-template" data-bind="itemsSource:Cells" data-key="Key">
                    <td class="lt-template" data-bind="class.ordersInfoAggregationRowTitle:IsRowTitle">
                        <span data-bind="text:Value; class.hidden:HasLink"></span>
                        <a class="hidden" target="_blank" data-bind="text:Value; href:Href; title:LinkTitle; class!.hidden:HasLink"></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="ordersInfoPager" data-bind="class.hidden:isAggregated">
        <button type="button" data-bind="disabled:previousDisabled" event-bind="click:previousPage()">Předchozí</button>
        <span data-bind="text:pageLabel"></span>
        <button type="button" data-bind="disabled:nextDisabled" event-bind="click:nextPage()">Další</button>
    </div>
</div>

<script>
    lt.element("ordersInfoGrid").withModel("app.OrdersInfo.vm").attach(function () {
        var vm = app.OrdersInfo.vm;

        this.toggleOrderDetail = function (order) {
            vm.toggleOrderDetail(order.OrderId);
        };

        this.openCustomerInCrm = function (order, event) {
            event.preventDefault();
            event.stopPropagation();
            vm.openCustomerInCrm(order);
        };

        this.previousPage = function () {
            vm.previousPage();
        };

        this.nextPage = function () {
            vm.nextPage();
        };

        vm.init();
    });
</script>
